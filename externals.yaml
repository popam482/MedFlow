# sync uses Git pins; update follows the selected branch for each module.
version: 1
modules:
  Database:
    path: Database
    repository: https://github.com/AlexM-058/MedFlow-Database.git
    branch: main
    dependsOn: []
    build: null
    reason: SQL sources only; migrations require a separate explicit command.
  AI:
    path: AI
    repository: https://github.com/AlexM-058/MedFlow-AI.git
    branch: main
    dependsOn: []
    build: null
    reason: Scaffold only; no executable TypeScript package yet.
  Backend:
    path: Backend
    repository: https://github.com/AlexM-058/MedFlow-Backend.git
    branch: main
    dev: dev
    dependsOn: [ Database, AI ]
    build: build
  Frontend:
    path: Frontend
    repository: https://github.com/AlexM-058/MedFlow-Frontend.git
    branch: feat/frontend-foundation
    dev: dev
    dependsOn: [ Backend ]
    build: build
